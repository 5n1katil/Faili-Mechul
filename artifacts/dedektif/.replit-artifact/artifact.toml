kind = "mobile"
previewPath = "/"
title = "Dedektif - Türkçe Bulmaca Oyunu"
version = "1.0.0"
id = "artifacts/dedektif"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 22971

[services.development]
run = "pnpm --filter @workspace/dedektif run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dedektif", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/dedektif", "run", "serve" ]

[services.env]
PORT = "22971"
BASE_PATH = "/"
