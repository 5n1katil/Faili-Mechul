name: Case QA certification

on:
  pull_request:
    paths:
      - ".case-qa/**"
      - ".github/workflows/fm-case-qa-v3.yml"
      - ".github/workflows/fm-case-qa-certification.yml"
      - ".github/workflows/fm-avatar-certification.yml"
      - ".github/workflows/fm-avatar-auto-merge.yml"
      - "artifacts/dedektif/data/puzzles.ts"
      - "artifacts/dedektif/data/puzzles_database.json"
      - "artifacts/dedektif/qa/**"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FM_QA_ROOT: ${{ github.workspace }}
      FM_QA_OUTPUT_DIR: .case-qa-output
      FM_QA_CERT_PHASE: pre

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check certification script syntax
        run: node --check .case-qa/fm_case_qa_certify.mjs

      - name: Test bounded patch-contract recovery
        run: node .case-qa/fm_case_qa_contract_recovery_test.mjs

      - name: Test checkpoint recovery and rejected-candidate feedback without API calls
        run: node .case-qa/fm_case_qa_repair_state_test.mjs

      - name: Test real Termal repair and offline single-case pilot
        run: node .case-qa/fm_case_qa_termal_regression_test.mjs

      - name: Test behavioral calibration and authoring isolation
        run: node .case-qa/fm_case_qa_behavioral_calibration_test.mjs

      - name: Test deterministic gold calibration fixtures
        run: node .case-qa/fm_case_qa_gold_fixture_test.mjs

      - name: Test strict production release gate
        run: node .case-qa/fm_case_qa_production_gate_test.mjs

      - name: Inventory exact case avatar assets
        shell: bash
        run: |
          set +e
          node .case-qa/fm_avatar_inventory.mjs
          status="$?"
          set -e
          if [ "$status" -gt 2 ]; then exit "$status"; fi

      - name: Certify exact sources and HTML simulator
        run: node .case-qa/fm_case_qa_certify.mjs

      - name: Validate application compatibility for reviewed case delivery
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @workspace/dedektif validate
          pnpm --filter @workspace/dedektif validate:parmak-izi
          pnpm --filter @workspace/scripts exec node --import tsx "$GITHUB_WORKSPACE/artifacts/dedektif/scripts/check-solvability.js"
          pnpm --filter @workspace/dedektif typecheck
          pnpm --filter @workspace/dedektif build:web

      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fm-case-qa-certification-${{ github.run_id }}
          path: .case-qa-output
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
