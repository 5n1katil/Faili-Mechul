name: Faili Mechul Case QA v3

on:
  push:
    branches: [main]
    paths:
      - ".case-qa/fm_case_qa_command.json"
  workflow_dispatch:
    inputs:
      mode:
        description: Guvenli tek/kucuk vaka icin pilot; toplu kosu icin full
        required: true
        default: pilot
        type: choice
        options: [audit, pilot, full]
      allow_ai:
        description: OpenAI ile sinirli onarimi ac
        required: true
        default: false
        type: boolean
      case_limit:
        description: Pilot icin 1 onerilir; en fazla 5
        required: true
        default: "1"
        type: string
      case_ids:
        description: Istege bagli, virgul ayrimli vaka ID listesi
        required: false
        default: ""
        type: string
      publish_draft_pr:
        description: Pilot secimini taslak PR olarak sun; full icin 105/105 kosulu zorunlu
        required: true
        default: true
        type: boolean
      auto_merge:
        description: Yalniz full 105/105 uretim kosusunda kullan; pilot daima taslaktir
        required: true
        default: false
        type: boolean
      prepare_avatar_manifest:
        description: QA sonrasi avatar koru/dogrula/uret manifestini hazirla
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: fm-case-qa-v3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FM_QA_ROOT: ${{ github.workspace }}
      FM_QA_MODE: ${{ github.event_name == 'push' && 'full' || inputs.mode }}
      FM_QA_ALLOW_AI: ${{ github.event_name == 'push' && 'true' || inputs.allow_ai }}
      FM_QA_CASE_LIMIT: ${{ github.event_name == 'push' && '0' || inputs.case_limit }}
      FM_QA_CASE_IDS: ${{ github.event_name == 'push' && '' || inputs.case_ids }}
      FM_QA_APPLY_TO_WORKTREE: ${{ github.event_name == 'push' && 'true' || inputs.publish_draft_pr }}
      FM_QA_OUTPUT_DIR: .case-qa-output
      FM_QA_CACHE_DIR: .case-qa-cache
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout locked main revision
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Certify exact sources and v29.4 HTML engine
        env:
          FM_QA_CERT_PHASE: pre
        run: |
          node .case-qa/fm_case_qa_contract_recovery_test.mjs
          node .case-qa/fm_case_qa_gold_fixture_test.mjs
          node .case-qa/fm_case_qa_certify.mjs

      - name: Install locked app dependencies
        if: ${{ github.event_name == 'push' || inputs.publish_draft_pr == true }}
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Restore idempotent response cache
        id: ai_cache_restore
        uses: actions/cache/restore@v4
        with:
          path: .case-qa-cache
          key: fm-case-qa-v3-${{ hashFiles('artifacts/dedektif/data/puzzles.ts', 'artifacts/dedektif/data/puzzles_database.json', '.case-qa/fm_case_qa_policy_v3_1.json') }}-${{ github.run_id }}
          restore-keys: |
            fm-case-qa-v3-${{ hashFiles('artifacts/dedektif/data/puzzles.ts', 'artifacts/dedektif/data/puzzles_database.json', '.case-qa/fm_case_qa_policy_v3_1.json') }}-
            fm-case-qa-v3-${{ hashFiles('artifacts/dedektif/data/puzzles.ts', 'artifacts/dedektif/data/puzzles_database.json', '.case-qa/fm_case_qa_policy_v3_1.json') }}
            fm-case-qa-v3-

      - name: Run deterministic QA and bounded repair
        run: node .case-qa/fm_case_qa_runner.mjs

      - name: Save idempotent response cache even when QA stops safely
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .case-qa-cache
          key: fm-case-qa-v3-${{ hashFiles('artifacts/dedektif/data/puzzles.ts', 'artifacts/dedektif/data/puzzles_database.json', '.case-qa/fm_case_qa_policy_v3_1.json') }}-${{ github.run_id }}

      - name: Certify post-repair identity and simulator parity
        env:
          FM_QA_CERT_PHASE: post
        run: node .case-qa/fm_case_qa_certify.mjs

      - name: Guard app compatibility and publishable diff
        if: ${{ github.event_name == 'push' || inputs.publish_draft_pr == true }}
        shell: bash
        run: |
          unexpected="$(git diff --name-only | grep -Ev '^(artifacts/dedektif/data/puzzles\.ts|artifacts/dedektif/data/puzzles_database\.json|artifacts/dedektif/qa/)' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected changed paths:"
            echo "$unexpected"
            exit 1
          fi

          git diff --check

          pnpm --filter @workspace/dedektif validate
          pnpm --filter @workspace/dedektif validate:parmak-izi
          pnpm --filter @workspace/scripts exec node --import tsx \
            "$GITHUB_WORKSPACE/artifacts/dedektif/scripts/check-solvability.js"
          pnpm --filter @workspace/dedektif typecheck
          pnpm --filter @workspace/dedektif build:web
          jq -n '{
            schema_version: "fm_case_qa_app_gate_v1",
            certified: true,
            checks: {
              icons: "pass",
              fingerprints: "pass",
              solvability: "pass",
              typecheck: "pass",
              web_build: "pass"
            }
          }' > .case-qa-output/fm_case_qa_app_gate.json

      - name: Enforce 105/105 production release gate
        id: production_gate
        if: ${{ github.event_name == 'push' || (inputs.mode == 'full' && inputs.allow_ai == true && inputs.publish_draft_pr == true) }}
        run: node .case-qa/fm_case_qa_production_gate.mjs

      - name: Enforce selected-case 100/100 review gate
        id: pilot_gate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'pilot' && inputs.allow_ai == true && inputs.publish_draft_pr == true }}
        shell: bash
        run: |
          report=.case-qa-output/fm_case_qa_run_report.json
          selected="$(jq -r '.summary.selected_cases' "$report")"
          passed="$(jq -r '.summary.final_campaign_passed' "$report")"
          quarantined="$(jq -r '.summary.quarantined' "$report")"
          cost="$(jq -r '.summary.actual_or_conservative_cost_usd' "$report")"
          if [ "$selected" -lt 1 ] || [ "$selected" -gt 5 ]; then
            echo "Pilot must contain 1-5 explicit cases; got $selected."
            exit 1
          fi
          if [ "$passed" -ne "$selected" ] || [ "$quarantined" -ne 0 ]; then
            echo "Selected-case gate failed: $passed/$selected passed, $quarantined quarantined."
            exit 1
          fi
          awk "BEGIN { exit !($cost <= 1.0) }" || {
            echo "Pilot cost cap exceeded: \$$cost"
            exit 1
          }
          echo "selected=$selected" >> "$GITHUB_OUTPUT"
          echo "cost=$cost" >> "$GITHUB_OUTPUT"

      - name: Prepare release and avatar handoff manifests
        if: ${{ steps.production_gate.outcome == 'success' }}
        id: publish_gate
        shell: bash
        run: |
          accepted="$(jq '.summary.publishable_change_count' .case-qa-output/fm_case_qa_run_report.json)"
          echo "accepted=$accepted" >> "$GITHUB_OUTPUT"
          mkdir -p artifacts/dedektif/qa/runs artifacts/dedektif/qa/avatar-refresh
          cp .case-qa-output/fm_case_qa_run_report.json "artifacts/dedektif/qa/runs/run-${GITHUB_RUN_ID}.json"
          cp .case-qa-output/fm_case_qa_release_manifest.json "artifacts/dedektif/qa/runs/release-${GITHUB_RUN_ID}.json"

          if [ "${{ github.event_name == 'push' || inputs.prepare_avatar_manifest == true }}" = "true" ]; then
            set +e
            node .case-qa/fm_avatar_inventory.mjs
            inventory_status="$?"
            set -e
            if [ "$inventory_status" -gt 2 ]; then
              echo "Avatar inventory crashed with status $inventory_status."
              exit "$inventory_status"
            fi
            cp .case-qa-output/fm_avatar_refresh_manifest.json "artifacts/dedektif/qa/avatar-refresh/run-${GITHUB_RUN_ID}.json"
            echo "avatar_manifest=artifacts/dedektif/qa/avatar-refresh/run-${GITHUB_RUN_ID}.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload complete QA and avatar handoff evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fm-case-qa-${{ github.run_id }}
          path: .case-qa-output
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Create selected-case draft review PR
        id: pilot_review
        if: ${{ steps.pilot_gate.outcome == 'success' }}
        shell: bash
        run: |
          branch="qa/case-review-${GITHUB_RUN_ID}"
          git config user.name "faili-mechul-qa-bot"
          git config user.email "qa-bot@users.noreply.github.com"
          git switch -c "$branch"
          git add artifacts/dedektif/data/puzzles.ts artifacts/dedektif/data/puzzles_database.json artifacts/dedektif/qa/case_qa_sidecars_v29_5.json
          if git diff --cached --quiet; then
            echo "Selected case was already certified at 100/100; no PR is needed." >> "$GITHUB_STEP_SUMMARY"
            echo "pr_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "qa: stage selected certified case review"
          git push --set-upstream origin "$branch"
          pr_url="$(gh pr create --draft --base main --head "$branch" --title "QA review: certified selected case(s) (${GITHUB_RUN_ID})" --body-file .case-qa-output/draft_pr_body.md)"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "Pilot PR is draft-only and was not merged automatically: $pr_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Create certified staging PR and merge automatically
        id: merge_release
        if: ${{ steps.production_gate.outcome == 'success' }}
        shell: bash
        run: |
          branch="qa/105-case-refresh-${GITHUB_RUN_ID}"
          git config user.name "faili-mechul-qa-bot"
          git config user.email "qa-bot@users.noreply.github.com"
          git switch -c "$branch"
          git add artifacts/dedektif/data/puzzles.ts artifacts/dedektif/data/puzzles_database.json artifacts/dedektif/qa
          if git diff --cached --quiet; then
            echo "No publishable content or manifest change; PR skipped."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            echo "main_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "qa: stage certified authoring metadata and case repairs"
          git push --set-upstream origin "$branch"
          pr_url="$(gh pr create --base main --head "$branch" --title "QA production: 105/105 certified cases (${GITHUB_RUN_ID})" --body-file .case-qa-output/draft_pr_body.md)"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name == 'push' || inputs.auto_merge == true }}" = "true" ]; then
            gh pr merge "$pr_url" --squash --delete-branch
            git fetch origin main
            echo "merged=true" >> "$GITHUB_OUTPUT"
            echo "main_sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          else
            echo "merged=false" >> "$GITHUB_OUTPUT"
            echo "main_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish campaign summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Faili Meçhul production campaign"
            echo
            if [ -f .case-qa-output/case_qa_summary.md ]; then
              cat .case-qa-output/case_qa_summary.md
            fi
            if [ -f .case-qa-output/fm_case_qa_release_manifest.json ]; then
              echo "- Production gate: $(jq -r '.production_ready' .case-qa-output/fm_case_qa_release_manifest.json)"
              echo "- Exact simulator: $(jq -r '.exact_pass_count' .case-qa-output/fm_case_qa_release_manifest.json)/$(jq -r '.exact_case_count' .case-qa-output/fm_case_qa_release_manifest.json)"
              echo "- Changed cases: $(jq -r '.changed_case_ids | length' .case-qa-output/fm_case_qa_release_manifest.json)"
            fi
            if [ -f .case-qa-output/fm_avatar_refresh_manifest.json ]; then
              echo "- Avatar assets inventoried: $(jq -r '.counts.total_assets' .case-qa-output/fm_avatar_refresh_manifest.json)"
              echo "- Structurally invalid avatar assets: $(jq -r '.counts.structurally_invalid' .case-qa-output/fm_avatar_refresh_manifest.json)"
              echo "- Avatar manifest: ${{ steps.publish_gate.outputs.avatar_manifest }}"
            fi
            echo "- Auto merged: ${{ steps.merge_release.outputs.merged }}"
            echo "- Main SHA: ${{ steps.merge_release.outputs.main_sha }}"
            echo "- PR: ${{ steps.merge_release.outputs.pr_url }}"
            echo "- Selected-case review PR: ${{ steps.pilot_review.outputs.pr_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
