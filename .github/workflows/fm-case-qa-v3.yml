name: Faili Mechul Case QA v3

on:
  workflow_dispatch:
    inputs:
      mode:
        description: audit, pilot veya full
        required: true
        default: audit
        type: choice
        options: [audit, pilot, full]
      allow_ai:
        description: OpenAI ile sinirli onarimi ac
        required: true
        default: false
        type: boolean
      case_limit:
        description: 0=tumu; pilot icin 5 onerilir
        required: true
        default: "0"
        type: string
      case_ids:
        description: Istege bagli, virgul ayrimli vaka ID listesi
        required: false
        default: ""
        type: string
      publish_draft_pr:
        description: Tam 105/105 kampanyayi izlenebilir PR uzerinden yayinla
        required: true
        default: true
        type: boolean
      auto_merge:
        description: Tum uretim kapilari gecerse PR'i otomatik squash-merge et
        required: true
        default: true
        type: boolean
      prepare_avatar_manifest:
        description: QA sonrasi avatar koru/dogrula/uret manifestini hazirla
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: fm-case-qa-v3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FM_QA_ROOT: ${{ github.workspace }}
      FM_QA_MODE: ${{ inputs.mode }}
      FM_QA_ALLOW_AI: ${{ inputs.allow_ai }}
      FM_QA_CASE_LIMIT: ${{ inputs.case_limit }}
      FM_QA_CASE_IDS: ${{ inputs.case_ids }}
      FM_QA_APPLY_TO_WORKTREE: ${{ inputs.publish_draft_pr }}
      FM_QA_OUTPUT_DIR: .case-qa-output
      FM_QA_CACHE_DIR: .case-qa-cache
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout locked main revision
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Certify exact sources and v29.4 HTML engine
        env:
          FM_QA_CERT_PHASE: pre
        run: node .case-qa/fm_case_qa_certify.mjs

      - name: Prepare app validation baseline
        if: ${{ inputs.publish_draft_pr == true }}
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm --version
          pnpm install --frozen-lockfile
          pnpm --filter @workspace/dedektif typecheck > .case-qa-output/typecheck-baseline.txt 2>&1 || true
          grep -E 'error TS[0-9]+:' .case-qa-output/typecheck-baseline.txt | sed "s#${GITHUB_WORKSPACE}/##g" | sort -u > .case-qa-output/typecheck-baseline-errors.txt || true

          run_validation() {
            name="$1"
            shift
            set +e
            "$@" > ".case-qa-output/${name}-baseline.txt" 2>&1
            status="$?"
            set -e
            echo "$status" > ".case-qa-output/${name}-baseline-status.txt"
            grep -E '^(ERROR:|HATA:|  ✗|  •|  - )' ".case-qa-output/${name}-baseline.txt" \
              | sed "s#${GITHUB_WORKSPACE}/##g" | sort -u \
              > ".case-qa-output/${name}-baseline-errors.txt" || true
          }

          run_validation icons pnpm --filter @workspace/dedektif validate
          run_validation fingerprints pnpm --filter @workspace/dedektif validate:parmak-izi
          run_validation solvability pnpm --filter @workspace/scripts exec node --import tsx \
            "$GITHUB_WORKSPACE/artifacts/dedektif/scripts/check-solvability.js"

      - name: Restore idempotent response cache
        id: ai_cache_restore
        uses: actions/cache/restore@v4
        with:
          path: .case-qa-cache
          key: fm-case-qa-v3-${{ hashFiles('artifacts/dedektif/data/puzzles.ts', 'artifacts/dedektif/data/puzzles_database.json', '.case-qa/fm_case_qa_policy_v3_1.json') }}-${{ github.run_id }}
          restore-keys: |
            fm-case-qa-v3-${{ hashFiles('artifacts/dedektif/data/puzzles.ts', 'artifacts/dedektif/data/puzzles_database.json', '.case-qa/fm_case_qa_policy_v3_1.json') }}-
            fm-case-qa-v3-${{ hashFiles('artifacts/dedektif/data/puzzles.ts', 'artifacts/dedektif/data/puzzles_database.json', '.case-qa/fm_case_qa_policy_v3_1.json') }}

      - name: Run deterministic QA and bounded repair
        run: node .case-qa/fm_case_qa_runner.mjs

      - name: Save idempotent response cache even when QA stops safely
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .case-qa-cache
          key: fm-case-qa-v3-${{ hashFiles('artifacts/dedektif/data/puzzles.ts', 'artifacts/dedektif/data/puzzles_database.json', '.case-qa/fm_case_qa_policy_v3_1.json') }}-${{ github.run_id }}

      - name: Certify post-repair identity and simulator parity
        env:
          FM_QA_CERT_PHASE: post
        run: node .case-qa/fm_case_qa_certify.mjs

      - name: Guard app compatibility and publishable diff
        if: ${{ inputs.publish_draft_pr == true }}
        shell: bash
        run: |
          accepted="$(jq '.summary.publishable_change_count' .case-qa-output/fm_case_qa_run_report.json)"
          if [ "$accepted" -eq 0 ]; then
            echo "No accepted candidate; app/diff publication gate skipped."
            exit 0
          fi

          unexpected="$(git diff --name-only | grep -Ev '^(artifacts/dedektif/data/puzzles\.ts|artifacts/dedektif/data/puzzles_database\.json|artifacts/dedektif/qa/)' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected changed paths:"
            echo "$unexpected"
            exit 1
          fi

          git diff --check

          run_validation() {
            name="$1"
            shift
            set +e
            "$@" > ".case-qa-output/${name}-candidate.txt" 2>&1
            status="$?"
            set -e
            echo "$status" > ".case-qa-output/${name}-candidate-status.txt"
            grep -E '^(ERROR:|HATA:|  ✗|  •|  - )' ".case-qa-output/${name}-candidate.txt" \
              | sed "s#${GITHUB_WORKSPACE}/##g" | sort -u \
              > ".case-qa-output/${name}-candidate-errors.txt" || true
          }

          run_validation icons pnpm --filter @workspace/dedektif validate
          run_validation fingerprints pnpm --filter @workspace/dedektif validate:parmak-izi
          run_validation solvability pnpm --filter @workspace/scripts exec node --import tsx \
            "$GITHUB_WORKSPACE/artifacts/dedektif/scripts/check-solvability.js"

          validation_regression=0
          for check in icons fingerprints solvability; do
            baseline_status="$(cat ".case-qa-output/${check}-baseline-status.txt")"
            candidate_status="$(cat ".case-qa-output/${check}-candidate-status.txt")"
            comm -13 ".case-qa-output/${check}-baseline-errors.txt" \
              ".case-qa-output/${check}-candidate-errors.txt" \
              > ".case-qa-output/${check}-new-errors.txt"

            if [ "$baseline_status" -eq 0 ] && [ "$candidate_status" -ne 0 ]; then
              echo "$check validation regressed from passing to failing."
              validation_regression=1
            fi
            if [ "$candidate_status" -ne 0 ] && [ ! -s ".case-qa-output/${check}-candidate-errors.txt" ]; then
              echo "$check failed without a recognized deterministic signature."
              validation_regression=1
            fi
            if [ -s ".case-qa-output/${check}-new-errors.txt" ]; then
              echo "$check introduced new deterministic validation errors:"
              cat ".case-qa-output/${check}-new-errors.txt"
              validation_regression=1
            fi
          done
          if [ "$validation_regression" -ne 0 ]; then
            exit 1
          fi

          pnpm --filter @workspace/dedektif typecheck > .case-qa-output/typecheck-candidate.txt 2>&1 || true
          grep -E 'error TS[0-9]+:' .case-qa-output/typecheck-candidate.txt | sed "s#${GITHUB_WORKSPACE}/##g" | sort -u > .case-qa-output/typecheck-candidate-errors.txt || true
          comm -13 .case-qa-output/typecheck-baseline-errors.txt .case-qa-output/typecheck-candidate-errors.txt > .case-qa-output/typecheck-new-errors.txt
          if [ -s .case-qa-output/typecheck-new-errors.txt ]; then
            echo "Candidate introduced new TypeScript errors:"
            cat .case-qa-output/typecheck-new-errors.txt
            exit 1
          fi
          pnpm --filter @workspace/dedektif build:web

      - name: Enforce 105/105 production release gate
        id: production_gate
        if: ${{ inputs.mode == 'full' && inputs.allow_ai == true && inputs.publish_draft_pr == true }}
        run: node .case-qa/fm_case_qa_production_gate.mjs

      - name: Prepare release and avatar handoff manifests
        if: ${{ steps.production_gate.outcome == 'success' }}
        id: publish_gate
        shell: bash
        run: |
          accepted="$(jq '.summary.publishable_change_count' .case-qa-output/fm_case_qa_run_report.json)"
          echo "accepted=$accepted" >> "$GITHUB_OUTPUT"
          mkdir -p artifacts/dedektif/qa/runs artifacts/dedektif/qa/avatar-refresh
          cp .case-qa-output/fm_case_qa_run_report.json "artifacts/dedektif/qa/runs/run-${GITHUB_RUN_ID}.json"
          cp .case-qa-output/fm_case_qa_release_manifest.json "artifacts/dedektif/qa/runs/release-${GITHUB_RUN_ID}.json"

          if [ "${{ inputs.prepare_avatar_manifest }}" = "true" ]; then
            set +e
            node .case-qa/fm_avatar_inventory.mjs
            inventory_status="$?"
            set -e
            if [ "$inventory_status" -gt 2 ]; then
              echo "Avatar inventory crashed with status $inventory_status."
              exit "$inventory_status"
            fi
            cp .case-qa-output/fm_avatar_refresh_manifest.json "artifacts/dedektif/qa/avatar-refresh/run-${GITHUB_RUN_ID}.json"
            echo "avatar_manifest=artifacts/dedektif/qa/avatar-refresh/run-${GITHUB_RUN_ID}.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload complete QA and avatar handoff evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fm-case-qa-${{ github.run_id }}
          path: .case-qa-output
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Create certified staging PR and merge automatically
        id: merge_release
        if: ${{ steps.production_gate.outcome == 'success' }}
        shell: bash
        run: |
          branch="qa/105-case-refresh-${GITHUB_RUN_ID}"
          git config user.name "faili-mechul-qa-bot"
          git config user.email "qa-bot@users.noreply.github.com"
          git switch -c "$branch"
          git add artifacts/dedektif/data/puzzles.ts artifacts/dedektif/data/puzzles_database.json artifacts/dedektif/qa
          if git diff --cached --quiet; then
            echo "No publishable content or manifest change; PR skipped."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            echo "main_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "qa: stage certified authoring metadata and case repairs"
          git push --set-upstream origin "$branch"
          pr_url="$(gh pr create --base main --head "$branch" --title "QA production: 105/105 certified cases (${GITHUB_RUN_ID})" --body-file .case-qa-output/draft_pr_body.md)"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.auto_merge }}" = "true" ]; then
            gh pr merge "$pr_url" --squash --delete-branch
            git fetch origin main
            echo "merged=true" >> "$GITHUB_OUTPUT"
            echo "main_sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          else
            echo "merged=false" >> "$GITHUB_OUTPUT"
            echo "main_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish campaign summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Faili Meçhul production campaign"
            echo
            if [ -f .case-qa-output/fm_case_qa_release_manifest.json ]; then
              echo "- Production gate: $(jq -r '.production_ready' .case-qa-output/fm_case_qa_release_manifest.json)"
              echo "- Exact simulator: $(jq -r '.exact_pass_count' .case-qa-output/fm_case_qa_release_manifest.json)/$(jq -r '.exact_case_count' .case-qa-output/fm_case_qa_release_manifest.json)"
              echo "- Changed cases: $(jq -r '.changed_case_ids | length' .case-qa-output/fm_case_qa_release_manifest.json)"
            fi
            if [ -f .case-qa-output/fm_avatar_refresh_manifest.json ]; then
              echo "- Avatar assets inventoried: $(jq -r '.counts.total_assets' .case-qa-output/fm_avatar_refresh_manifest.json)"
              echo "- Structurally invalid avatar assets: $(jq -r '.counts.structurally_invalid' .case-qa-output/fm_avatar_refresh_manifest.json)"
              echo "- Avatar manifest: ${{ steps.publish_gate.outputs.avatar_manifest }}"
            fi
            echo "- Auto merged: ${{ steps.merge_release.outputs.merged }}"
            echo "- Main SHA: ${{ steps.merge_release.outputs.main_sha }}"
            echo "- PR: ${{ steps.merge_release.outputs.pr_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
